name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Semanal: detecta si Tricount cambió su API aunque no haya cambios en el repo.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lectura (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mínima y más reciente soportadas. Cada ejecución registra una sesión nueva en la API
        # de Tricount, así que no se prueban todas las versiones intermedias.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      # Solo lectura, sobre el tricount de ejemplo público. test_write.py no corre aquí porque
      # crea tricounts reales.
      - run: python test_stdio.py

  build:
    name: Paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
