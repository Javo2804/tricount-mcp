[project]
name = "tricount-mcp"
version = "0.1.0"
description = "MCP server to read and edit Tricount from any AI assistant (unofficial)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Avello" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "tricount", "expense-sharing", "split-bills", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp==2.2.0",
    "httpx==0.28.1",
    "cryptography==50.0.1",
]

[project.urls]
Homepage = "https://github.com/Javo2804/tricount-mcp"
Documentation = "https://github.com/Javo2804/tricount-mcp/blob/main/QUICKSTART.md"
Issues = "https://github.com/Javo2804/tricount-mcp/issues"
Changelog = "https://github.com/Javo2804/tricount-mcp/blob/main/CHANGELOG.md"

[project.scripts]
tricount-mcp = "server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "tricount_client"]
